<svg height="210px" width="320px" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: Arial, sans-serif;
}

#background {
  x: 5px;
  y: 5px;
  height: calc(210px - 2 * 5px);
  width: calc(320px - 2 * 5px);
  fill: white;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
}

foreignObject {
  padding: 18px;
}

h2 {
  margin-top: -2px;
  margin-bottom: 0;
  line-height: 18px;
  font-size: 15px;
  font-weight: 600;
  color: rgb(36, 41, 46);
}

ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  line-height: 26px;
  font-size: 13px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
}

div.ellipsis {
  height: calc(210px - 2 * 18px);
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: rgb(88, 96, 105);
  margin-right: 0.25ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: rgb(225, 228, 232);
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-top: 15px;
  margin-bottom: 10px;
}

.progress-item {
  outline: 2px solid rgb(225, 228, 232);
  border-collapse: collapse;
}

.lang {
  font-weight: 600;
  margin-right: 0.75ch;
  color: rgb(36, 41, 46);
}

.percent {
  color: rgb(88, 96, 105)
}

@media (prefers-color-scheme: dark) {
  #background {
    fill: rgb(13, 17, 23);
    stroke-width: 0.5px;
  }

  h2 {
    color: rgb(201, 209, 217);
  }

  .octicon {
    fill: rgb(139, 148, 158);
  }

  .progress {
    background-color: rgba(110, 118, 129, 0.4);
  }

  .progress-item {
    outline: 2px solid rgb(57, 63, 71);
  }

  .lang {
    color: rgb(201, 209, 217);
  }

  .percent {
    color: rgb(139, 148, 158);
  }
}
</style>
<rect id="background" rx="6px" ry="6px" />
