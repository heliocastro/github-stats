name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    # Runs daily at 00:05 UTC. Adjust as you like.
    - cron: "5 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Provision Python 3.13 via uv, with uv's dependency cache enabled
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true
          activate-environment: true

      # Install dependencies with uv (system-wide, so `python3` picks them up)
      - name: Install requirements
        run: uv pip install -r requirements.txt

      # Generate all statistics images (overview.svg, languages.svg)
      - name: Generate images
        run: |
          python3 --version
          python3 generate_images.py
        env:
          # Personal Access Token with read:user + repo scopes, covering
          # your personal/non-CARIAD repos. CARIAD is excluded below, so
          # SSO authorization against that org is not required.
          ACCESS_TOKEN: ${{ secrets.STATS_GITHUB_HELIOCASTRO }}
          GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_HELIOCASTRO }}
          # Comma-separated owner/repo entries or glob patterns to skip.
          # CARIAD/* excludes every repo in the CARIAD enterprise org.
          EXCLUDED: "cariad-digital-dev/*,cariad-pmt/*,CARiAD-T1/*, cariad-t2/*,cariad-ude/*,carsoftwareorg/*,cariad-optima/*,vwdfive/*"
          # Comma-separated languages to drop from the breakdown, e.g. html,tex
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          EXCLUDE_FORKED_REPOS: true

      # Commit all changed files back to the repo
      - name: Commit to the repo
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@users.noreply.github.com"
          git add .
          # Force the build to succeed even if nothing changed
          git commit -m 'Update generated stats images' || true
          git push
